# @package _global_
# The 20 oz vitaminwater bottle instead of the 5 cm cube: `+object=bottle`.
# The ceiling localizer finds its red label (prpl_tidybot.bottle_localizer) and the
# top-down pick closes across the bottle's axis, not along it: the 85 mm 2F-85 spans
# the 66 mm bottle but not its 20 cm length. A bottle repeats every 180 degrees.
# The pick's "closing yaw" is the pinch frame's y, but the pads move along its x
# (top_down_pick.finger_axis), so laying "closing" ALONG the axis (offset 0) puts the
# pads across it. 2026-11-02: offset 90 put them along the bottle, onto its top.
#
# The cube source's node is cleared first (`_self_` before `bottle_source`), since a
# merge would keep its cube-only keys.
defaults:
  - _self_
  - bottle_source

env:
  pipelines:
    real:
      perceiver:
        target_source: null

pick:
  top_down:
    # The onboard position controller: the compliant arm's hover was 47 mm off on the
    # real bottle (2026-11-02 run 52), against ~9.5 mm per side across it.
    arm_controller: angular
    symmetry_deg: 180.0
    wrist_yaw_offset_deg: 0.0
    # Which way round the bottle is held is otherwise a coin toss (that fold is the
    # 180-degree symmetry above): at the hover one wrist frame says which end is toward
    # its top, and the wrist turns half a turn there unless it is the neck
    # (robot_skills.BOTTLE_END_UP, prpl_tidybot.bottle_neck). 2026-11-05: 8/12 held
    # neck-up, 4/12 base-up, and throws with identical parameters landed 1.2 m apart.
    orient_bottle_neck: true
    # Whether the bottle is still in the hand after the lift and the carry: the
    # gripper reading cannot say (it stays where the fingers stopped when the bottle
    # slips out; 2026-11-06 pick 20 read 0.262, "held", and the bottle fell during the
    # carry). One wrist frame at the end of the carry, `settle_s` after the arm stops,
    # scores how much of the gap between the finger pads is not plain floor
    # (prpl_tidybot.wrist_hold): 63/63 real holds of 2026-11-05/06 scored 0.33 or
    # more, the slip and the closes on nothing 0.005 or less. Below `threshold` the
    # attempt is a miss: the gripper opens there and the pick's retry follows. No
    # frame or a camera error: the gripper's verdict stands, and the attempt's
    # wrist_hold says so.
    wrist_hold_check:
      enabled: true
      threshold: 0.15
      settle_s: 0.3
    # The wrist servo finds the blue foam cube (OpenCV hue 95-130): it does not see
    # the red bottle, and it does see the blue bin (hue ~127).
    lateral_servo:
      enabled: false
    # No pick out of the bin: it plans for the 5 cm cube (in_bin.cube_width, a 70 mm
    # opening against the 66 mm bottle) and has never run on the bottle, and in the
    # barrier layout the floor and in-bin picks are one skill, so in-bin misses would
    # pull down the floor pick's competence. A bottle in the bin is refused and the bin
    # dump (dump_bin) empties it instead (Josh, 2026-11-02: "dump every time"). The
    # floor pick's wall check keeps the same margins (robot_skills.bin_margins).
    in_bin:
      enabled: false

# observe()["cube_upright"] is the cube's flat-on-a-face check, its silhouette fit's
# IoU against skill_server.upright_min_iou (0.75). A lying bottle has no other rest
# the pick sees (a standing one is not found at all) and fits at ~0.75 on a good
# frame, so every bottle found on the floor is resting.
skill_server:
  upright_min_iou: 0.0
  # The held bottle sticks out of the gripper and the ceiling cameras still find its
  # label, projected onto the floor ~2 m away (2026-11-05: held at gripper 0.33,
  # reported across the tape, so the planner saw no bottle in hand).
  held_object_visible: true

# mode=sim draws and rests the bottle lying (its radius off the floor).
sim:
  object: bottle
  object_half: 0.033
